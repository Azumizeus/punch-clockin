name: Release

# A chaque tag v* : build APK signe (prebuild + gradle), puis GitHub Release
# avec l'APK et la video demo en assets, notes depuis docs/RELEASE-NOTES-*.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install native deps
        working-directory: punch-native
        run: npm ci

      # Le secret du tresor est OBLIGATOIRE pour une release : sans lui l'APK
      # partirait avec le gabarit zero (aucun lot ni paiement possible depuis
      # le tresor). On echoue tot avec un message d'action clair.
      - name: Inject treasury key (secret required)
        working-directory: punch-native
        env:
          TREASURY_SECRET_DEVNET: ${{ secrets.TREASURY_SECRET_DEVNET }}
        run: |
          if [ -z "$TREASURY_SECRET_DEVNET" ]; then
            echo "::error::Secret TREASURY_SECRET_DEVNET absent : refuse de construire un APK au gabarit zero."
            echo "Ajouter le secret (JSON : tableau de 64 octets) dans Settings > Secrets and variables > Actions > Repository secrets, puis retag."
            exit 1
          fi
          node scripts/inject-treasury.mjs

      # Le dossier android/ n'est pas tracke : prebuild le regenere
      # (le template embarque le keystore debug utilise pour signer).
      - name: Expo prebuild (android)
        working-directory: punch-native
        run: npx expo prebuild -p android --no-install

      - name: Grant gradlew execute
        working-directory: punch-native/android
        run: chmod +x gradlew

      - name: Build signed APK
        working-directory: punch-native/android
        run: ./gradlew assembleRelease --no-daemon

      # Renomme l'artefact avec le tag : punch-clockin-seeker-<tag>.apk
      - name: Rename APK
        run: |
          cp punch-native/android/app/build/outputs/apk/release/app-release.apk \
             punch-clockin-seeker-${{ github.ref_name }}.apk
          sha256sum punch-clockin-seeker-${{ github.ref_name }}.apk \
             > punch-clockin-seeker-${{ github.ref_name }}.apk.sha256

      # Notes : docs/RELEASE-NOTES-<version>.md (tag v1.6.6 -> 1.6.6),
      # sinon un resume minimal est genere.
      - name: Prepare release body
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Le fichier peut s'appeler RELEASE-NOTES-v1.6.6.md (avec le v)
          # ou RELEASE-NOTES-1.6.6.md (sans) — on accepte les deux.
          if [ -f "docs/RELEASE-NOTES-${GITHUB_REF_NAME}.md" ]; then
            cp "docs/RELEASE-NOTES-${GITHUB_REF_NAME}.md" RELEASE_BODY.md
          elif [ -f "docs/RELEASE-NOTES-${VER}.md" ]; then
            cp "docs/RELEASE-NOTES-${VER}.md" RELEASE_BODY.md
          else
            printf '# PUNCH %s\n\nAPK signe (arm64) — voir docs/RELEASE-NOTES des versions precedentes.\n' \
              "$GITHUB_REF_NAME" > RELEASE_BODY.md
          fi
          # Honnetete avant tout : si le APK a ete construit avec le gabarit
          # zero (pas de secret CI), on l'annonce clairement dans la Release.
          if [ "$TREASURY_FALLBACK" = "1" ]; then
            printf '\n> ⚠️ APK construit sans le secret tresor (gabarit demo) : configurez le secret TREASURY_SECRET_DEVNET, ou installez un APK construit avec la vraie cle.\n' >> RELEASE_BODY.md
          fi

      # Rebuild sur un tag deplace : purge les assets de l'ancienne release
      # (sinon l'APK gabarit resterait cote a cote du bon).
      - name: Remove previous release assets (re-tag rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2>/dev/null \
            | while read -r a; do gh release delete-asset "$GITHUB_REF_NAME" "$a" -y || true; done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            punch-clockin-seeker-${{ github.ref_name }}.apk
            punch-clockin-seeker-${{ github.ref_name }}.apk.sha256
            punch-native/releases/punch-clockin-demo.mp4
            punch-native/releases/punch-clockin-demo.srt
          fail_on_unmatched_files: true
