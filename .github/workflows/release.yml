name: Release

# A chaque tag v* : build APK signe (prebuild + gradle), puis GitHub Release
# avec l'APK et la video demo en assets, notes depuis docs/RELEASE-NOTES-*.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install native deps
        working-directory: punch-native
        run: npm ci

      # Le secret du tresor n'est pas versionne : vrai secret CI s'il existe,
      # sinon gabarit zero (l'APK sera marque « demo tresor »).
      - name: Inject treasury key (secret or stub)
        working-directory: punch-native
        env:
          TREASURY_SECRET_DEVNET: ${{ secrets.TREASURY_SECRET_DEVNET }}
        run: node scripts/inject-treasury.mjs

      # Le dossier android/ n'est pas tracke : prebuild le regenere
      # (le template embarque le keystore debug utilise pour signer).
      - name: Expo prebuild (android)
        working-directory: punch-native
        run: npx expo prebuild -p android --no-install

      - name: Grant gradlew execute
        working-directory: punch-native/android
        run: chmod +x gradlew

      - name: Build signed APK
        working-directory: punch-native/android
        run: ./gradlew assembleRelease --no-daemon

      # Renomme l'artefact avec le tag : punch-clockin-seeker-<tag>.apk
      - name: Rename APK
        run: |
          cp punch-native/android/app/build/outputs/apk/release/app-release.apk \
             punch-clockin-seeker-${{ github.ref_name }}.apk
          sha256sum punch-clockin-seeker-${{ github.ref_name }}.apk \
             > punch-clockin-seeker-${{ github.ref_name }}.apk.sha256

      # Notes : docs/RELEASE-NOTES-<version>.md (tag v1.6.6 -> 1.6.6),
      # sinon un resume minimal est genere.
      - name: Prepare release body
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -f "docs/RELEASE-NOTES-${VER}.md" ]; then
            cp "docs/RELEASE-NOTES-${VER}.md" RELEASE_BODY.md
          else
            printf '# PUNCH %s\n\nAPK signe (arm64) — voir docs/RELEASE-NOTES des versions precedentes.\n' \
              "$GITHUB_REF_NAME" > RELEASE_BODY.md
          fi
          # Honnetete avant tout : si le APK a ete construit avec le gabarit
          # zero (pas de secret CI), on l'annonce clairement dans la Release.
          if [ "$TREASURY_FALLBACK" = "1" ]; then
            printf '\n> ⚠️ APK construit sans le secret tresor (gabarit demo) : configurez le secret TREASURY_SECRET_DEVNET, ou installez un APK construit avec la vraie cle.\n' >> RELEASE_BODY.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            punch-clockin-seeker-${{ github.ref_name }}.apk
            punch-clockin-seeker-${{ github.ref_name }}.apk.sha256
            punch-native/releases/punch-clockin-demo.mp4
          fail_on_unmatched_files: true
