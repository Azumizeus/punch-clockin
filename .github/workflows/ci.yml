name: CI

# Verrouille la qualite a chaque push : economie + types des deux apps.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  economy-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Le secret du tresor n'est pas versionne : la CI compile avec la vraie
      # cle (secret GitHub) ou le gabarit zero sinon.
      - name: Inject treasury key (secret or stub)
        working-directory: punch-native
        env:
          TREASURY_SECRET_DEVNET: ${{ secrets.TREASURY_SECRET_DEVNET }}
        run: node scripts/inject-treasury.mjs

      # 1) Harnais economiques — 54 verifications offline (split 92/3/5, frais,
      #    soldes, compteurs). Aucune dependance, aucun reseau.
      - name: Harnais economiques
        run: node punch-native/scripts/test-store-economy.mjs

      # 2) Typecheck app native (le code economique y vit aussi)
      - name: Install native deps
        working-directory: punch-native
        run: npm ci

      - name: Typecheck native
        working-directory: punch-native
        run: npx tsc --noEmit

      # 3) Typecheck app web (partage la meme economie)
      - name: Install web deps
        working-directory: "punch app grok/PUNCH"
        run: npm ci

      - name: Typecheck web
        working-directory: "punch app grok/PUNCH"
        run: npx tsc --noEmit

      # 4) Garde-fou vitrine : docs/site/device/ doit correspondre a la
      #    version d'app.json (MANIFEST + sha256). Echoue si un bump a ete
      #    pousse sans relancer scripts/device/vitrine.py sur le Seeker.
      - name: Device gallery sync
        run: python tools/check_device_sync.py

      # 5) Garde-fou page preuve : docs/site/proof.html doit etre regeneree
      #    depuis le MANIFEST courant (version, sha256, poids). Echoue si la
      #    page a derive du manifeste.
      - name: Proof page sync
        run: python tools/make_proof_page.py --check

      # 6) Cohérence release/code : le tag de la dernière release publiée ne
      #    doit pas être PLUS RÉCENT que app.json (sinon l'APK en ligne affiche
      #    une version que le code ne porte plus). Plus ancien = avertissement
      #    seulement (fenêtre transitoire bump -> re-tag).
      - name: Release tag sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/check_release_tag.py

      # 7) Garde-fou release : l'APK publie correspond a son .sha256 embarque
      #    (re-telecharge et verifie octet par octet) et le MANIFEST.json
      #    embarque sur la release est celui du repo. GITHUB_TOKEN est fourni
      #    par Actions ; PUNCH_RELEASE_TAG force une release precise sinon
      #    c'est la latest.
      - name: Release assets check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/check_release_assets.py
